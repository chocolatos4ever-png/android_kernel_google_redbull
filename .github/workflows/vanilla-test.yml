name: Pixel 5 Vanilla Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Redbull kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          path: workspace/private/msm-google
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            bc bison flex build-essential \
            zip unzip rsync cpio \
            libssl-dev libelf-dev \
            gcc g++ make file \
            lz4 zstd

      - name: Set up Repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch build workspace dependencies
        working-directory: workspace
        run: |
          set -euxo pipefail
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-msm-redbull-4.19-android14-qpr3 \
            --depth=1
          repo sync -c -j2 --fail-fast

      - name: Check out the intended kernel source
        working-directory: workspace
        run: |
          set -euxo pipefail
          echo "Kernel source revision:"
          git -C private/msm-google rev-parse HEAD
          echo "Kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
            private/msm-google/Makefile

      - name: Build vanilla kernel
        working-directory: workspace
        run: |
          set -euxo pipefail
          test -f build/build.sh
          test -f private/msm-google/build.config.redbull.no-cfi
          BUILD_CONFIG=private/msm-google/build.config.redbull.no-cfi \
            build/build.sh

      - name: Upload kernel build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbull-vanilla-kernel
          path: |
            workspace/out/android-msm-pixel-4.19/dist/
            workspace/private/msm-google/out/
          if-no-files-found: warn
          retention-days: 7
