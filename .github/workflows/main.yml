
name: Inspect Pixel 5 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect redbull kernel configuration
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show repository information
        shell: bash
        run: |
          set -eu

          echo "===== Repository ====="
          pwd

          echo "===== Current commit ====="
          git log -1 --oneline

          echo "===== Top-level files ====="
          ls -la

      - name: Inspect kernel build scripts
        shell: bash
        run: |
          set -u

          for f in \
            build_redbull.sh \
            build.config.redbull \
            build.config.redbull.no-cfi \
            build.config.redbull.common.clang
          do
            echo
            echo "===== $f ====="

            if [ -f "$f" ]; then
              cat "$f"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Inspect available defconfigs
        shell: bash
        run: |
          set -u

          echo "===== Redbull defconfigs ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -name 'redbull*' \
            -print 2>/dev/null || true

          for f in \
            arch/arm64/configs/redbull_defconfig \
            arch/arm64/configs/redbull-gki_defconfig
          do
            echo
            echo "===== $f ====="

            if [ -f "$f" ]; then
              grep -nE \
                'CONFIG_(ARM64|LOCALVERSION|LTO|CFI|KSU|SUSFS|BUILD_ARM64_UNCOMPRESSED_KERNEL)' \
                "$f" || true
            else
              echo "MISSING: $f"
            fi
          done

      - name: Inspect compiler and build references
        shell: bash
        run: |
          set -u

          echo "===== AndroidKernel.mk ====="

          if [ -f AndroidKernel.mk ]; then
            grep -nE \
              'CLANG|CROSS_COMPILE|DEFCONFIG|BUILD_CONFIG|build\.sh|KERNEL_DIR|LTO|CFI|TARGET_KERNEL_ARCH' \
              AndroidKernel.mk || true
          else
            echo "AndroidKernel.mk is missing"
          fi

          echo
          echo "===== Makefile version ====="

          if [ -f Makefile ]; then
            head -5 Makefile
          else
            echo "Kernel Makefile is missing"
          fi

          echo
          echo "===== Available build tools and directories ====="

          for p in \
            build/build.sh \
            build.config \
            prebuilts \
            clang \
            toolchain \
            private/msm-google
          do
            if [ -e "$p" ]; then
              echo "FOUND: $p"
            else
              echo "MISSING: $p"
            fi
          done

      - name: Inspect KernelSU and SUSFS status
        shell: bash
        run: |
          set -u

          echo "===== Existing KernelSU references ====="
          git grep -n -i -E 'kernelsu|ksu' -- \
            'arch/arm64/configs/*' \
            'drivers/*' \
            'fs/*' \
            'include/*' 2>/dev/null | head -100 || true

          echo
          echo "===== Existing SUSFS references ====="
          git grep -n -i 'susfs' -- \
            'arch/arm64/configs/*' \
            'drivers/*' \
            'fs/*' \
            'include/*' 2>/dev/null | head -100 || true

      - name: Finish inspection
        shell: bash
        run: |
          echo "Inspection complete."
          echo "No kernel compilation or source modifications were performed."
          
