
name: Inspect Redbull kernel tree

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-24.0

      - name: Inspect build files
        shell: bash
        run: |
          set -euxo pipefail

          git log -1 --oneline

          for f in \
            build_redbull.sh \
            build.config.redbull \
            build.config.redbull.no-cfi \
            build.config.redbull.common.clang \
            build/build.sh
          do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done

          echo "Kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' Makefile

          echo "Root directory entries:"
          ls -la

          echo "Relevant config files:"
          find . -maxdepth 4 -type f \
            \( -name '*redbull*' -o -name 'build.sh' \) \
            | sort | head -200

      - name: Inspect kernel build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Redbull build wrapper ==="
          cat build_redbull.sh

          echo "=== Main Redbull config ==="
          cat build.config.redbull

          echo "=== No-CFI config ==="
          cat build.config.redbull.no-cfi

          echo "=== Common Clang config ==="
          cat build.config.redbull.common.clang

          echo "=== Available Clang references ==="
          grep -nE 'CLANG|TOOLCHAIN|BUILD_CONFIG|MAKE_ARGS|DEFCONFIG|KERNEL_DIR' \
            build.config.redbull* AndroidKernel.mk | head -200

          echo "=== Existing defconfig ==="
          grep -nE 'CONFIG_(ARM64|LOCALVERSION|LTO|CFI|KSU|SUSFS)' \
            arch/arm64/configs/redbull_defconfig || true

            
      - name: Inspect build configuration
        shell: bash
        run: |
          set -u

          echo "===== build_redbull.sh ====="
          cat build_redbull.sh

          echo "===== build.config.redbull ====="
          cat build.config.redbull

          echo "===== build.config.redbull.no-cfi ====="
          cat build.config.redbull.no-cfi

          echo "===== build.config.redbull.common.clang ====="
          cat build.config.redbull.common.clang

          echo "===== AndroidKernel.mk build references ====="
          grep -nE 'CLANG|CROSS_COMPILE|DEFCONFIG|BUILD_CONFIG|build\.sh|KERNEL_DIR' \
            AndroidKernel.mk | head -150 || true

          echo "===== Redbull defconfig options ====="
          grep -nE 'CONFIG_(ARM64|LOCALVERSION|LTO|CFI|KSU|SUSFS)' \
            arch/arm64/configs/redbull_defconfig || true

          echo "===== Available toolchain directories ====="
          find . -maxdepth 3 -type d \
            \( -iname '*clang*' -o -iname '*toolchain*' \) | head -80
            
            
