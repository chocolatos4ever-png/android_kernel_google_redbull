
name: Inspect Redbull kernel tree

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-24.0

      - name: Inspect build files
        shell: bash
        run: |
          set -euxo pipefail

          git log -1 --oneline

          for f in \
            build_redbull.sh \
            build.config.redbull \
            build.config.redbull.no-cfi \
            build.config.redbull.common.clang \
            build/build.sh
          do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done

          echo "Kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' Makefile

          echo "Root directory entries:"
          ls -la

          echo "Relevant config files:"
          find . -maxdepth 4 -type f \
            \( -name '*redbull*' -o -name 'build.sh' \) \
            | sort | head -200
