
name: Inspect Pixel 5 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 1

      - name: Inspect root build configuration
        shell: bash
        run: |
          set -eu

          for file in \
            build.config.redbull \
            build.config.redbull.no-cfi \
            build.config.redbull.common \
            build.config.redbull.common.clang \
            build.config.common \
            build.config.redbull.gcc \
            build.config.sm8250.common
          do
            echo
            echo "===== $file ====="
            if [ -f "$file" ]; then
              cat "$file"
            else
              echo "MISSING"
            fi
          done

          echo
          echo "===== Build-system references ====="
          git grep -n -E \
            'ROOT_DIR|KERNEL_DIR|BUILD_CONFIG|build/build.sh|CLANG_PREBUILT_BIN|CLANG_VERSION|CROSS_COMPILE' \
            -- '*.sh' '*.config*' 'Makefile' || true

          echo
          echo "===== Kernel Makefile targets ====="
          grep -n -E '^(Image|Image\.gz|modules|defconfig|%config):' Makefile || true
          
      - name: Compare build files with LineageOS
        shell: bash
        run: |
          set -eu

          echo "===== Fork branch and commit ====="
          git remote -v
          git log -1 --format='%H%n%s'

          echo
          echo "===== Root build files ====="
          ls -la build.config* build_redbull.sh 2>/dev/null || true

          echo
          echo "===== Git submodules ====="
          cat .gitmodules 2>/dev/null || echo "No .gitmodules file"

          echo
          echo "===== Expected build-system directories ====="
          for path in build private/msm-google; do
            if [ -d "$path" ]; then
              echo "FOUND: $path"
            else
              echo "MISSING: $path"
            fi
          done
          
      - name: Inspect repository and kernel version
        shell: bash
        run: |
          set -eu

          echo "===== Repository ====="
          git log -1 --oneline
          echo
          echo "===== Kernel version ====="
          head -n 5 Makefile

          echo
          echo "===== Required build files ====="
          for path in \
            build/build.sh \
            build.config \
            private/msm-google \
            arch/arm64/configs/redbull_defconfig \
            arch/arm64/configs/redbull-gki_defconfig
          do
            if [ -e "$path" ]; then
              echo "FOUND: $path"
            else
              echo "MISSING: $path"
            fi
          done

      - name: Search KernelSU and SUSFS precisely
        shell: bash
        run: |
          set -eu

          echo "===== KernelSU paths ====="
          find . -iname '*kernelsu*' -o -iname '*ksu*' \
            | head -n 100 || true

          echo
          echo "===== SUSFS paths ====="
          find . -iname '*susfs*' \
            | head -n 100 || true

          echo
          echo "===== KernelSU configuration references ====="
          git grep -n -E \
            'CONFIG_KSU|CONFIG_KSU_SUSFS|kernelsu|KernelSU' \
            -- ':!Documentation' || true

          echo
          echo "===== SUSFS configuration references ====="
          git grep -n -i 'susfs' \
            -- ':!Documentation' || true

      - name: Inspect build configuration
        shell: bash
        run: |
          set -eu

          echo "===== Redbull build wrapper ====="
          cat build_redbull.sh

          echo
          echo "===== AndroidKernel.mk key settings ====="
          grep -n -E \
            'TARGET_KERNEL_ARCH|KERNEL_DEFCONFIG|KERNEL_LLVM_SUPPORT|CLANG|CROSS_COMPILE' \
            AndroidKernel.mk || true

          echo
          echo "===== Compiler tools on runner ====="
          command -v clang || true
          command -v ld.lld || true
          clang --version 2>/dev/null | head -n 2 || true
          
