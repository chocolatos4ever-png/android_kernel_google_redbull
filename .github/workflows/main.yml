
      - name: Inspect kernel build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Redbull build wrapper ==="
          cat build_redbull.sh

          echo "=== Main Redbull config ==="
          cat build.config.redbull

          echo "=== No-CFI config ==="
          cat build.config.redbull.no-cfi

          echo "=== Common Clang config ==="
          cat build.config.redbull.common.clang

          echo "=== Available Clang references ==="
          grep -nE 'CLANG|TOOLCHAIN|BUILD_CONFIG|MAKE_ARGS|DEFCONFIG|KERNEL_DIR' \
            build.config.redbull* AndroidKernel.mk | head -200

          echo "=== Existing defconfig ==="
          grep -nE 'CONFIG_(ARM64|LOCALVERSION|LTO|CFI|KSU|SUSFS)' \
            arch/arm64/configs/redbull_defconfig || true
