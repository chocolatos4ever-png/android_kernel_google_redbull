name: Build LineageOS 24.0 Kernel with KSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev curl wget cpio gettext zip

      - name: Download Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Integrate SUSFS
        run: |
          # Clone SUSFS repository (Try GitLab first, fallback to GitHub mirror if rate-limited)
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src || git clone --depth=1 https://github.com/dev-sm8350/susfs4ksu.git susfs_src
          
          # Copy SUSFS core files into your kernel tree
          cp -rp susfs_src/kernel_patches/fs/* fs/
          cp -rp susfs_src/kernel_patches/include/linux/* include/linux/
          
          # Apply kernel-side SUSFS patches
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          patch -p1 < susfs_src/kernel_patches/fs/susfs.patch || true
          
          # --- MANUAL FIXES FOR REJECTED HUNKS ---
          awk '/#include "internal.h"/{print; print "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif"; next}1' fs/proc/task_mmu.c > temp && mv temp fs/proc/task_mmu.c
          awk '/#include <linux\/fs.h>/{print; print "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif"; next}1' fs/open.c > temp && mv temp fs/open.c
          awk '/unsigned int lookup_flags = LOOKUP_FOLLOW;/{print; print "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\tstruct filename* fname;\n\tint status;\n\tint error;\n#endif\n\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\tfname = getname_safe(filename);\n\tstatus = susfs_sus_path_by_filename(fname, &error, SYSCALL_FAMILY_ALL_ENOENT);\n\tputname_safe(fname);\n\n\tif (status) {\n\t\treturn error;\n\t}\n#endif\n"; next}1' fs/open.c > temp && mv temp fs/open.c
          
          # Dynamically locate and apply the KernelSU-Next side SUSFS patch
          cd KernelSU-Next
          KSU_PATCH=$(find ../susfs_src/kernel_patches -iname "*ksu*.patch" | head -n 1)
          if [ -n "$KSU_PATCH" ]; then
            echo "Applying patch: $KSU_PATCH"
            patch -p1 < "$KSU_PATCH" || true
          else
            echo "No KSU patch found in susfs_src/kernel_patches"
          fi
          cd ..

      - name: Generate Config & Enable Flags
        env:
          ARCH: arm64
        run: |
          make O=out ARCH=arm64 CC=clang \
               LLVM=1 LLVM_IAS=1 \
               vendor/redfin_defconfig
          
          scripts/config --file out/.config \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH
            
          make O=out ARCH=arm64 CC=clang \
               LLVM=1 LLVM_IAS=1 \
               olddefconfig

      - name: Compile Redfin Kernel
        env:
          PATH: ${{ github.workspace }}/toolchain/bin:${{ env.PATH }}
        run: |
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      Image.lz4 dtbo.img

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          
          cp out/arch/arm64/boot/Image.lz4 AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          cd AnyKernel3
          
          sed -i 's/kernel.string=.*/kernel.string=LineageOS 24.0 KernelSU-Next + SUSFS/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=redfin/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bramble/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=Pixel 5/g' anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot;/g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=1;/g' anykernel.sh
          sed -i '/write_boot;/i flash_dtbo;' anykernel.sh
          
          zip -r9 ../Pixel5-KernelSU-Next-SUSFS.zip *
          cd ..

      - name: Generate Release Tag
        id: time
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Kernel-${{ env.date }}"
          name: "Pixel 5 (Redfin) KernelSU-Next + SUSFS - ${{ env.date }}"
          files: Pixel5-KernelSU-Next-SUSFS.zip
          body: |
            Automated kernel build for Google Pixel 5 (Redfin).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
