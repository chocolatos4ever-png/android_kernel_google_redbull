name: Pixel 5 Kernel Build Preparation

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    paths:
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

concurrency:
  group: redbull-kernel-check
  cancel-in-progress: true

jobs:
  prepare:
    name: Verify kernel source
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 1

      - name: Print checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Source revision ====="
          git rev-parse HEAD
          git log -1 --format='%h %s'
          echo "===== Current branch ====="
          git branch --show-current

      - name: Verify kernel source and configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Kernel version ====="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

          echo "===== Architecture configuration ====="
          if find arch -type f -name 'redbull_defconfig' -print -quit | grep -q .; then
            find arch -type f -name 'redbull_defconfig' -print
          else
            echo "::error::redbull_defconfig not found"
            exit 1
          fi

          echo "===== Redbull build configuration files ====="
          find . -maxdepth 3 -type f \
            \( -name 'build.config.redbull*' -o -name 'build_redbull.sh' \) \
            -print

          echo "===== Build-system check ====="
          if [ -f build/build.sh ]; then
            echo "build/build.sh exists in this checkout."
          else
            echo "::notice::build/build.sh is not in this kernel-only repository."
            echo "A matching Android kernel build workspace is required."
          fi

          echo "===== Toolchain check ====="
          if [ -d prebuilts-master/clang/host/linux-x86 ]; then
            echo "Android Clang prebuilt directory exists."
          else
            echo "::notice::Android Clang prebuilts are not included in this checkout."
          fi

          echo "===== Diagnostic checks completed ====="
