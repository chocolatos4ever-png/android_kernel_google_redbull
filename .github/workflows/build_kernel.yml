name: Build Pixel 5 Kernel with KernelSU-Next & SusFS

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel_source

      - name: Integrate SusFS (Kernel 4.19)
        run: |
          cd kernel_source
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs_tmp
          cp -r susfs_tmp/kernel_patches/* ./
          patch -p1 < 50_add_susfs_in_kernel*.patch || true
          rm -rf susfs_tmp

      - name: Build Kernel using Build Action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel_source
          config: redbull_defconfig
          arch: arm64
          # Bypass AOSP auto-download endpoints by supplying a direct prebuilt Clang URL:
          other-clang-url: https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          anykernel3: true
          anykernel3-url: https://github.com/KernelSU/AnyKernel3
          release: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel5-KernelSU-Next-SusFS-Zip
          path: output/*.zip
