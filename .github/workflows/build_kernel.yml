name: Build Pixel 5 Kernel with KernelSU-Next & SusFS

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Your Forked Kernel Source
        uses: actions/checkout@v4
        with:
          repository: chocolatos4ever-png/android_kernel_google_redbull  # ⚠️ Replace with your actual GitHub username!
          ref: lineage-24.0
          path: kernel_source

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev libgmp-dev libmpc-dev

      - name: Integrate KernelSU-Next
        run: |
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

      - name: Integrate SusFS (Kernel 4.19)
        run: |
          cd kernel_source
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs_tmp
          cp -r susfs_tmp/kernel_patches/* ./
          patch -p1 < 50_add_susfs_in_kernel*.patch || true
          rm -rf susfs_tmp

      - name: Build Kernel using Build Action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel_source
          config: redbull_defconfig
          arch: arm64
          aosp-clang: true
          aosp-gcc: true
          anykernel3: true
          anykernel3-url: https://github.com/KernelSU/AnyKernel3
          release: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel5-KernelSU-Next-SusFS-Zip
          path: output/*.zip
